name: logger

networks:
  logger:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  app_data:
    driver: local

services:
  # ── PostgreSQL 16 + pg_partman ────────────────────────────────────────────
  postgres:
    image: logger-db
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: logger-db
    restart: unless-stopped
    command: >
      postgres
        -c shared_preload_libraries=pg_partman_bgw
        -c pg_partman_bgw.dbname=log_ingestion_db
        -c pg_partman_bgw.interval=3600
        -c pg_partman_bgw.role=postgres
        -c max_connections=50
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c maintenance_work_mem=64MB
        -c work_mem=8MB
        -c wal_buffers=16MB
        -c gin_pending_list_limit=16MB
        -c min_wal_size=128MB
        -c max_wal_size=2GB
        -c checkpoint_timeout=15min
        -c checkpoint_completion_target=0.9
        -c wal_compression=off
        -c synchronous_commit=off
        -c random_page_cost=1.1
        -c timezone=UTC
        -c max_parallel_workers_per_gather=0
        -c max_parallel_workers=0
        -c max_parallel_maintenance_workers=0
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password_here
      POSTGRES_DB: log_ingestion_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - logger
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d log_ingestion_db"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g

  # ── DB migrations (runs once, applies src/DB/migrations, then exits) ───────
  migrate:
    image: logger-app
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        PORT: 8080
    container_name: logger-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://postgres:your_password_here@postgres:5432/log_ingestion_db
    networks:
      - logger
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      [
        "npx",
        "tsx",
        "./node_modules/node-pg-migrate/bin/node-pg-migrate.js",
        "up",
        "--migrations-dir",
        "src/DB/migrations",
      ]

  app:
    image: logger-app
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        PORT: 8080
    container_name: logger-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgresql://postgres:your_password_here@postgres:5432/log_ingestion_db
      PG_WRITE_POOL_MAX: "1"
      PG_QUERY_POOL_MAX: "2"
      PG_AGGREGATE_POOL_MAX: "2"
      PG_IDLE_TIMEOUT_MS: "30000"
      PG_CONNECTION_TIMEOUT_MS: "15000"
      INGEST_BUFFER_ENABLED: "true"
      FLUSH_INTERVAL_MS: "5"
      FLUSH_BATCH_SIZE: "4000"
      FLUSH_CONCURRENCY: "1"
      QUEUE_MAX_SIZE: "100000"
      RETENTION_DAYS: "30"
    ports:
      - "8080:8080"
    volumes:
      - app_data:/usr/src/app/data
    command: ["node", "dist/server.js"]
    networks:
      - logger
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m

  load-test:
    image: logger-app
    container_name: logger-load
    restart: "no"
    profiles: ["load-test"]
    environment:
      BASE_URL: http://app:8080
    volumes:
      - ./load-test:/usr/src/app/load-test
    networks:
      - logger
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["npx", "tsx", "load-test/run.ts"]
