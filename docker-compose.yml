name: logger

networks:
  logger:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  app_data:
    driver: local

services:
  # ── PostgreSQL 16 + pg_partman ────────────────────────────────────────────
  postgres:
    image: logger-db
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: logger-db
    restart: unless-stopped
    command: >
      postgres
        -c shared_preload_libraries=pg_partman_bgw
        -c pg_partman_bgw.dbname=${POSTGRES_DB}
        -c pg_partman_bgw.interval=3600
        -c pg_partman_bgw.role=${POSTGRES_USER}
        -c max_connections=50
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c maintenance_work_mem=64MB
        -c work_mem=8MB
        -c wal_buffers=16MB
        -c gin_pending_list_limit=8MB
        -c min_wal_size=128MB
        -c max_wal_size=2GB
        -c checkpoint_timeout=15min
        -c checkpoint_completion_target=0.9
        -c wal_compression=on
        -c synchronous_commit=off
        -c random_page_cost=1.1
        -c timezone=UTC
        -c max_parallel_workers_per_gather=0
        -c max_parallel_workers=0
        -c max_parallel_maintenance_workers=0
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - logger
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g

  # ── DB migrations (runs once, applies src/DB/migrations, then exits) ───────
  migrate:
    image: logger-app
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        PORT: ${PORT}
    container_name: logger-migrate
    restart: "no"
    env_file: .env
    environment:
      # localhost in .env is for host-local npm; inside Compose the DB host is the service name.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
    networks:
      - logger
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      [
        "npx",
        "tsx",
        "./node_modules/node-pg-migrate/bin/node-pg-migrate.js",
        "up",
        "--migrations-dir",
        "src/DB/migrations",
      ]

  app:
    image: logger-app
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        PORT: ${PORT}
    container_name: logger-app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - app_data:/usr/src/app/data
      - ./src:/usr/src/app/src
    command: ["npx", "tsx", "watch", "src/server.ts"]
    networks:
      - logger
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m

  load-test:
    image: logger-app
    container_name: logger-load
    restart: "no"
    profiles: ["load-test"]
    env_file: .env
    environment:
      BASE_URL: http://app:${PORT}
    volumes:
      - ./load-test:/usr/src/app/load-test
    networks:
      - logger
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["npx", "tsx", "load-test/run.ts"]
