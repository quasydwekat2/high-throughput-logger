name: high-throughput-logger

networks:
  logger-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local

services:
  # ── PostgreSQL 16 + pg_partman ────────────────────────────────────────────
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: ht-logger-postgres
    restart: unless-stopped
    command: >
      postgres
        -c shared_preload_libraries=pg_partman_bgw
        -c pg_partman_bgw.dbname=${POSTGRES_DB:-log_ingestion_db}
        -c pg_partman_bgw.interval=3600
        -c pg_partman_bgw.role=${POSTGRES_USER:-postgres}
        -c max_connections=50
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c maintenance_work_mem=64MB
        -c work_mem=4MB
        -c wal_buffers=16MB
        -c min_wal_size=128MB
        -c max_wal_size=1GB
        -c checkpoint_timeout=15min
        -c checkpoint_completion_target=0.9
        -c wal_compression=on
        -c synchronous_commit=off
        -c random_page_cost=1.1
        -c timezone=UTC
        -c max_parallel_workers_per_gather=0
        -c max_parallel_workers=0
        -c max_parallel_maintenance_workers=0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-log_ingestion_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - logger-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-log_ingestion_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g

  # ── DB migrations (runs once, applies src/DB/migrations, then exits) ───────
  migrate:
    image: ht-logger:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PORT: ${PORT:-8080}
    container_name: ht-logger-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-log_ingestion_db}
    networks:
      - logger-net
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      [
        "npx",
        "tsx",
        "./node_modules/node-pg-migrate/bin/node-pg-migrate.js",
        "up",
        "--migrations-dir",
        "src/DB/migrations",
      ]

  app:
    image: ht-logger:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PORT: ${PORT:-8080}
    container_name: ht-logger-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:-8080}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-log_ingestion_db}
      PG_WRITE_POOL_MAX: ${PG_WRITE_POOL_MAX:-2}
      PG_QUERY_POOL_MAX: ${PG_QUERY_POOL_MAX:-2}
      PG_AGGREGATE_POOL_MAX: ${PG_AGGREGATE_POOL_MAX:-2}
      PG_IDLE_TIMEOUT_MS: ${PG_IDLE_TIMEOUT_MS:-30000}
      PG_CONNECTION_TIMEOUT_MS: ${PG_CONNECTION_TIMEOUT_MS:-15000}
      INGEST_BUFFER_ENABLED: ${INGEST_BUFFER_ENABLED:-true}
      FLUSH_INTERVAL_MS: ${FLUSH_INTERVAL_MS:-25}
      FLUSH_BATCH_SIZE: ${FLUSH_BATCH_SIZE:-8000}
      FLUSH_CONCURRENCY: ${FLUSH_CONCURRENCY:-1}
      QUEUE_MAX_SIZE: ${QUEUE_MAX_SIZE:-500000}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    networks:
      - logger-net
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m

  # ── Load test (local; profile load-test — not started by default) ─────────
  load-test:
    image: ht-logger:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PORT: ${PORT:-8080}
    container_name: ht-logger-load-test
    restart: "no"
    profiles: ["load-test"]
    environment:
      BASE_URL: http://app:${PORT:-8080}
      TARGET_LOGS_PER_SEC: ${TARGET_LOGS_PER_SEC:-15000}
      TOTAL_LOGS: ${TOTAL_LOGS:-1000000}
      BATCH_SIZE: ${BATCH_SIZE:-500}
      CONCURRENCY: ${CONCURRENCY:-32}
      AGGREGATE_INTERVAL_MS: ${AGGREGATE_INTERVAL_MS:-1000}
      QUERY_INTERVAL_MS: ${QUERY_INTERVAL_MS:-2000}
      VISIBILITY_DEADLINE_MS: ${VISIBILITY_DEADLINE_MS:-20000}
      AGGREGATE_P95_MAX_MS: ${AGGREGATE_P95_MAX_MS:-1000}
      WARMUP_SEC: ${WARMUP_SEC:-5}
      HEALTH_TIMEOUT_MS: ${HEALTH_TIMEOUT_MS:-120000}
      PACE_FACTOR: ${PACE_FACTOR:-1.05}
    networks:
      - logger-net
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["node", "dist-load-test/run.js"]
