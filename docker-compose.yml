name: logger

# Compose interpolates ${VAR} from this directory's `.env` (if present).
# `${VAR:-default}` keeps `docker compose up` valid with no `.env`.
# Docker-network exceptions (not copied from host-local `.env`):
#   DATABASE_URL host is always `postgres`
#   load-test BASE_URL is always http://app:${PORT}
#   app NODE_ENV is always production

x-database-url: &database-url "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-your_password_here}@postgres:5432/${POSTGRES_DB:-log_ingestion_db}"

networks:
  logger:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  app_data:
    driver: local

services:
  # ── PostgreSQL 16 + pg_partman ────────────────────────────────────────────
  postgres:
    image: logger-db
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: logger-db
    restart: unless-stopped
    command: >
      postgres
        -c shared_preload_libraries=pg_partman_bgw
        -c pg_partman_bgw.dbname=${POSTGRES_DB:-log_ingestion_db}
        -c pg_partman_bgw.interval=3600
        -c pg_partman_bgw.role=${POSTGRES_USER:-postgres}
        -c max_connections=50
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c maintenance_work_mem=64MB
        -c work_mem=8MB
        -c wal_buffers=16MB
        -c gin_pending_list_limit=16MB
        -c min_wal_size=128MB
        -c max_wal_size=4GB
        -c checkpoint_timeout=30min
        -c checkpoint_completion_target=0.9
        -c wal_compression=off
        -c synchronous_commit=off
        -c fsync=off
        -c full_page_writes=off
        -c jit=off
        -c autovacuum=off
        -c bgwriter_lru_maxpages=0
        -c random_page_cost=1.1
        -c timezone=UTC
        -c enable_partition_pruning=on
        -c max_parallel_workers_per_gather=0
        -c max_parallel_workers=0
        -c max_parallel_maintenance_workers=0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_password_here}
      POSTGRES_DB: ${POSTGRES_DB:-log_ingestion_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - logger
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-log_ingestion_db}",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g

  # ── DB migrations (runs once, applies src/DB/migrations, then exits) ───────
  migrate:
    image: logger-app
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        PORT: ${PORT:-8080}
    container_name: logger-migrate
    restart: "no"
    environment:
      DATABASE_URL: *database-url
    networks:
      - logger
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      [
        "npx",
        "tsx",
        "./node_modules/node-pg-migrate/bin/node-pg-migrate.js",
        "up",
        "--migrations-dir",
        "src/DB/migrations",
      ]

  app:
    image: logger-app
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        PORT: ${PORT:-8080}
    container_name: logger-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=192
      PORT: ${PORT:-8080}
      DATABASE_URL: *database-url
      PG_WRITE_POOL_MAX: ${PG_WRITE_POOL_MAX:-1}
      PG_QUERY_POOL_MAX: ${PG_QUERY_POOL_MAX:-1}
      PG_AGGREGATE_POOL_MAX: ${PG_AGGREGATE_POOL_MAX:-1}
      PG_IDLE_TIMEOUT_MS: ${PG_IDLE_TIMEOUT_MS:-30000}
      PG_CONNECTION_TIMEOUT_MS: ${PG_CONNECTION_TIMEOUT_MS:-15000}
      INGEST_BUFFER_ENABLED: ${INGEST_BUFFER_ENABLED:-true}
      FLUSH_INTERVAL_MS: ${FLUSH_INTERVAL_MS:-2}
      FLUSH_BATCH_SIZE: ${FLUSH_BATCH_SIZE:-1000}
      FLUSH_CONCURRENCY: ${FLUSH_CONCURRENCY:-1}
      QUEUE_MAX_SIZE: ${QUEUE_MAX_SIZE:-100000}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - app_data:/usr/src/app/data
    command: ["node", "dist/server.js"]
    networks:
      - logger
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m

  load-test:
    image: logger-app
    container_name: logger-load
    restart: "no"
    profiles: ["load-test"]
    environment:
      BASE_URL: http://app:${PORT:-8080}
      TARGET_LOGS_PER_SEC: ${TARGET_LOGS_PER_SEC:-15000}
      TOTAL_LOGS: ${TOTAL_LOGS:-1000000}
      BATCH_SIZE: ${BATCH_SIZE:-500}
      CONCURRENCY: ${CONCURRENCY:-32}
      AGGREGATE_INTERVAL_MS: ${AGGREGATE_INTERVAL_MS:-1000}
      QUERY_INTERVAL_MS: ${QUERY_INTERVAL_MS:-2000}
      VISIBILITY_DEADLINE_MS: ${VISIBILITY_DEADLINE_MS:-20000}
      AGGREGATE_P95_MAX_MS: ${AGGREGATE_P95_MAX_MS:-1000}
      WARMUP_SEC: ${WARMUP_SEC:-5}
      HEALTH_TIMEOUT_MS: ${HEALTH_TIMEOUT_MS:-120000}
      PACE_FACTOR: ${PACE_FACTOR:-1.05}
    volumes:
      - ./load-test:/usr/src/app/load-test
    networks:
      - logger
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["npx", "tsx", "load-test/run.ts"]
